name: Javascript

on:
  push:
    branches:
      - "master"
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: "package.json"
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        run: npm run compile
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: "package.json"
      - name: Install dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run fmt:check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: "package.json"
      - name: Install dependencies
        run: npm ci
      - name: Lint JS
        run: npm run eslint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: "package.json"
      - name: Install dependencies
        run: npm ci
      - name: Typescript
        run: npm run typecheck
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: "package.json"
      - name: Install dependencies
        run: npm ci
      # Releases bundle a gh-codeowners release instead.
      - name: Build gh-codeowners
        shell: bash
        run: |
          cargo install --locked --root gh-codeowners \
            --git https://github.com/chdsbd/gh-codeowners \
            --rev fb180d596b1a2d513e424dfed56f4266fadc4522
          mkdir bin
          cp gh-codeowners/bin/* bin/
      - name: Run tests ${{ matrix.os }}
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run tests ${{ matrix.os }}
        if: runner.os != 'Linux'
        run: npm test
