name: Publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  # A build for each platform bundles gh-codeowners as the language server.
  # The universal build has no binary, for other platforms, and falls back to
  # the built-in features.
  publish:
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - linux-arm64
          - alpine-x64
          - alpine-arm64
          - win32-x64
          - win32-arm64
          - universal
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false
      - name: Check tag matches package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Download gh-codeowners
        if: matrix.target != 'universal'
        run: ./s/download-server "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Visual Studio Marketplace
        run: |
          if [[ "$TARGET" == universal ]]; then
            npx --no-install vsce publish --oidc
          else
            npx --no-install vsce publish --oidc --target "$TARGET"
          fi
        env:
          TARGET: ${{ matrix.target }}
